name: Daily Clinic Schedule Reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Daily Reminder & Auto-Post Endpoint
        run: |
          RAW_URL="${{ secrets.SITE_URL }}"
          if [ -z "$RAW_URL" ]; then
            RAW_URL="https://mitazoun-schedule.vercel.app"
          fi
          BASE_URL="${RAW_URL%/}"
          response=$(curl -sS -L -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${BASE_URL}/api/send-reminders")
          echo "$response"
          http_code=$(echo "$response" | tail -n 1 | awk '{print $2}')
          if [ -z "$http_code" ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Error: Endpoint returned non-2xx HTTP status ($http_code)"
            exit 1
          fi
